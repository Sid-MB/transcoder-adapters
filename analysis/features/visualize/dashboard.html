              <button type="button" data-save-prompt="${j}">Save prompt</button>
            </div>
          </div>
          ${renderSourceMetadata(ex)}
          ${renderExample(ex, lo, hi)}
          <div class="source-transcript" hidden>
            <div class="source-transcript-head"><span></span></div>
            <div class="source-transcript-body"></div>
          </div>
          <div class="prompt-status meta-mini"></div>
        </div>`
      ).join('');

      qbody.querySelectorAll('.example-block').forEach((container) => {
        bindHoverActivationMarkers(container, lo, hi);
      });

      qbody.querySelectorAll('[data-show-source-transcript]').forEach((button) => {
        button.onclick = async () => {
          const exampleIndex = Number(button.getAttribute('data-show-source-transcript'));
          const container = button.closest('.example-block');
          await showSourceTranscript(exs[exampleIndex] || {}, container, lo, hi);
          const panel = container.querySelector('.source-transcript');
          button.textContent = panel && !panel.hidden ? 'Hide transcript' : 'Show transcript';
        };
      });

      qbody.querySelectorAll('[data-copy-transcript]').forEach((button) => {
        button.onclick = async () => {
          const exampleIndex = Number(button.getAttribute('data-copy-transcript'));
          const container = button.closest('.example-block');
          const example = exs[exampleIndex] || {};
          try {
            let transcript = exampleTranscript(example);
            if (example.source_metadata) {
              const payload = await loadSourceTranscriptPayload(example, true);
              transcript = payload.transcript || transcript;
            }
            await copyText(transcript);
            setPromptStatus(container, 'Copied transcript.', false);
          } catch (e) {
            setPromptStatus(container, `Copy failed: ${e.message}`, true);
          }
        };
      });

      qbody.querySelectorAll('[data-save-prompt]').forEach((button) => {
        button.onclick = async () => {
          const exampleIndex = Number(button.getAttribute('data-save-prompt'));
          const container = button.closest('.example-block');
          const example = exs[exampleIndex] || {};
          setPromptStatus(container, 'Saving prompt…', false);
          try {
            const transcriptPayload = await loadSourceTranscriptPayload(example, true);
            const transcript = transcriptPayload.transcript || '';
            const res = await fetch('/api/save_prompt', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                transcript,
                cantor_id: cantorId,
                layer: feat.layer,
                feature: feat.feature,
                quantile_name: q.quantile_name || ('Quantile ' + qi),
                example_index: exampleIndex,
              }),
            });
            const savePayload = await res.json();
            if (!res.ok) throw new Error(savePayload.error || JSON.stringify(savePayload));
            setPromptStatus(
              container,
              `Saved ${savePayload.display_path || savePayload.path} · prompt_format=${savePayload.prompt_format}`,
              false
            );
          } catch (e) {
            setPromptStatus(container, `Save failed: ${e.message}`, true);
          }
        };
      });
    }

    quants.forEach((q, i) => {
      const b = document.createElement('button');
      const quantileName = q.quantile_name || ('Quantile ' + i);
      b.textContent = quantileName;
      b.setAttribute('data-quantile-index', String(i));
      b.setAttribute('data-quantile-name', quantileName);
      if (i === 0) b.classList.add('active');
      b.onclick = () => {
        qi = i;
        qtabs.querySelectorAll('button').forEach((x) => x.classList.remove('active'));
        b.classList.add('active');
        renderQuant();
      };
      qtabs.appendChild(b);
    });
    renderQuant();
  }

  async function boot() {
    el('src-hint').textContent = '(metadata from server)';
    const [res, annRes] = await Promise.all([
      fetch('/api/metadata'),
      fetch('/api/annotations'),
    ]);
    if (!res.ok) {
      el('overview').innerHTML = `<p class="err">Could not load metadata: HTTP ${res.status}</p>`;
      return;
    }
    if (annRes.ok) annotations = await annRes.json();
    rawMeta = await res.json();
    if (rawMeta.error) {
      el('overview').innerHTML = `<p class="err">${escapeHtml(rawMeta.error)}</p>`;
      return;
    }
    rows = buildRows(rawMeta);
    renderOverview(rawMeta);
    renderTagFilter();
    renderRelativePresets();
    thead();

    const labels = relativeDomains();
    const sortOptions = [
      '<option value="freq">Activation freq</option>',
      '<option value="layer">Layer</option>',
    ];
    if (hasRelativeScores()) {
      sortOptions.push(
        `<option value="rel">${escapeHtml(labels.target)} / ${escapeHtml(labels.baseline)} frequency lift</option>`,
        `<option value="p95_ratio">${escapeHtml(labels.target)} / ${escapeHtml(labels.baseline)} p95 strength</option>`,
        `<option value="p99_ratio">${escapeHtml(labels.target)} / ${escapeHtml(labels.baseline)} p99 strength</option>`,
        `<option value="max_ratio">${escapeHtml(labels.target)} / ${escapeHtml(labels.baseline)} max-bin strength</option>`
      );
    }
    sortOptions.push(
      '<option value="skew">Domain skew (max−min fraction)</option>',
      '<option value="cantor">Cantor id</option>',
      ...domainKeys.map((k) => `<option value="d_${encodeURIComponent(k)}">Density · ${escapeHtml(k)}</option>`),
    );
    el('sort-key').innerHTML = sortOptions.join('');

    el('q').oninput = applyFilter;
    el('logit-q').oninput = scheduleLogitSearch;
    el('tag-filter').onchange = applyFilter;
    el('layer-min').oninput = applyFilter;
    el('layer-max').oninput = applyFilter;
    el('sort-key').onchange = applyFilter;
    el('sort-dir').onchange = applyFilter;
    el('prev').onclick = () => { if (page > 0) { page--; renderTable(); } };
    el('next').onclick = () => {
      if ((page + 1) * PAGE < filtered.length) { page++; renderTable(); }
    };
    window.onpopstate = () => {
      const cantorId = cantorIdFromPath();
      if (cantorId == null) {
        selectedCantor = null;
        renderTable();
        el('detail').innerHTML = '<div class="detail-empty">Select a feature from the table.</div>';
        return;
      }
      selectCantor(cantorId, { updateUrl: false });
    };

    applyFilter();
    const initialCantor = cantorIdFromPath();
    if (initialCantor != null) {
      selectCantor(initialCantor, { updateUrl: false, scroll: true });
    }
  }

  boot();
})();
  </script>
</body>
</html>
