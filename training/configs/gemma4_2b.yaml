# Bridging transcoder config between Gemma4 E2B and Gemma4 E2B-it.
model_name: "google/gemma-4-E2B"
model_arch: "gemma4"
run_name_prefix: "gemma4_2b"

transcoder:
  n_features: 8192
  dec_bias: true
  l1_weight: 0.0005

bridging:
  reference_model_path: "google/gemma-4-E2B-it"
  backbone: "target"
  loss_type: "kl"
  n_cutoffs: 1
  sampling: "uniform"
  always_include_adapt_only: true
  lambda_bridge: 2.0
  lambda_nmse: 1

datasets:
  - type: "fineweb"
    datapath: "science-of-finetuning/fineweb-1m-sample"
    max_seq_length: 1000
    length_excession_behavior: "truncate"
    weight: 0.35
  - type: "lmsys_chat"
    datapath: "siddharthmb/2026.transcoder-adapters.lmsys-chat-1m-splits"
    max_seq_length: 1000
    length_excession_behavior: "truncate"
    weight: 0.65
total_rows: 10000
weight_by: "tokens"
loss_on_prompt: true

batch_size: 1
learning_rate: 8e-4
num_epochs: 1
warmup_ratio: 0.05

val_frequency: 2000
layerwise_val_frequency: 4000
token_metrics_n_samples: 0
token_metrics_final_n_samples: 500

use_wandb: true
save_checkpoints: true
checkpoint_frequency: 10000
push_to_hub: true
