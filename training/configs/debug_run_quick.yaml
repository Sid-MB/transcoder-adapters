# Pipeline test — minimal run to verify the full train + save + upload flow
model_name: "google/gemma-2-2b"
model_arch: "gemma2"
run_name_prefix: "debug_run_quick_gemma2"

transcoder:
  n_features: 8192
  dec_bias: true
  l1_weight: 0.001

bridging:
  reference_model_path: "google/gemma-2-2b-it"
  backbone: "target"
  loss_type: "kl"
  n_cutoffs: 1
  sampling: "uniform"
  always_include_adapt_only: true
  lambda_bridge: 2.0
  lambda_nmse: 1

datasets:
  - type: "fineweb"
    datapath: "science-of-finetuning/fineweb-1m-sample"
    max_seq_length: 512
    length_excession_behavior: "truncate"
total_rows: 50
loss_on_prompt: true

batch_size: 1
learning_rate: 8e-4
num_epochs: 1
warmup_ratio: 0.05

use_wandb: true
save_checkpoints: false
push_to_hub: true
debug_mode: false
