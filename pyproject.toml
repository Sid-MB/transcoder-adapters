[project]
name = "transcoder-adapters"
version = "0.1.0"
description = "Sparse transcoder adapters for bridging distillation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "torch>=2.11.0",
    "transformers<5.0",
    "huggingface-hub<2.0",
    "numpy>=2.0.0",
    "safetensors>=0.7.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
    "wandb>=0.26.1",
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
]

[project.optional-dependencies]
analysis = [
    "openai>=2.33.0",
    "python-dotenv>=1.2.2",
]
viz = [
    # circuit-tracer currently requires huggingface-hub<1.0,
    # while Gemma4 support in transformers main requires huggingface-hub>=1.5.
    "circuit-tracer",
]
vllm = [
    "vllm>=0.20.0",
]

all = [
    "transcoder-adapters[analysis,vllm]",
]

[tool.uv.sources]
circuit-tracer = { git = "https://github.com/decoderesearch/circuit-tracer" }
